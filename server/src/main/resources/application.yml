# FailureForge server configuration.
# Every value can be overridden by an environment variable, e.g. DB_PASSWORD, GERRIT_USERNAME.
# Secrets are never written in this file.

spring:
  application:
    name: failureforge-server
  config:
    # Per-machine secrets (DB password, Gerrit HTTP password) live in this git-ignored file.
    import: optional:file:./application-local.yml
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/failureforge}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
  # Flyway creates/updates tables from src/main/resources/db/migration on startup.
  flyway:
    enabled: true
  threads:
    virtual:
      enabled: true
  mvc:
    # Errors come back as JSON with a readable "detail" field the portal can show.
    problemdetails:
      enabled: true

server:
  port: ${PORT:8090}

management:
  endpoints:
    web:
      exposure:
        include: health,info

failureforge:
  # The LLM (D-028): any OpenAI-compatible /v1/chat/completions server. Defaults = Ollama on this machine.
  # Office laptop: put the office URL/model in application-local.yml (never in git; the repo is public).
  llm:
    base-url: ${FF_LLM_BASE_URL:http://localhost:11434/v1}
    # Dev default: Qwen3-8B with an 8k context (docs/ollama/Modelfile, D-039). Create it once with:
    #   ollama pull hf.co/Qwen/Qwen3-8B-GGUF:Q4_K_M
    #   ollama create failureforge-qwen3 -f docs/ollama/Modelfile
    model: ${FF_LLM_MODEL:failureforge-qwen3}
    api-key: ${FF_LLM_API_KEY:}
    bypass-proxy: true
    max-tokens: 2048
    temperature: 0
    timeout-seconds: 900
    # Qwen3 on Ollama "thinks" out loud by default, which is slow; this switches it off. Empty for the office LLM.
    prompt-suffix: ${FF_LLM_PROMPT_SUFFIX:" /no_think"}
    extra-body: {}
  agent:
    # false = Phase 1 behaviour only (existing tests), no LLM calls.
    enabled: ${FF_AGENT_ENABLED:true}
    max-rules: 6
    # Rules attacked per run (each takes ~1.5 min with the laptop model). FF_MAX_ATTACKS=1 for a quick live demo.
    max-attacks: ${FF_MAX_ATTACKS:3}
    max-repairs: 3
    jqwik-version: 1.10.2
  # Folder where each run's checkout lives: <work-dir>/run-<id>
  work-dir: ${FF_WORK_DIR:./work}
  worker:
    # How often the worker checks the queue for new runs (milliseconds).
    poll-interval-ms: 2000
  # JIRA + Confluence (ticket and wiki links). Optional: public servers need no login. Put real values in
  # application-local.yml. Data Center: token only (personal access token). Cloud: username (email) + API token.
  atlassian:
    username: ${FF_ATLASSIAN_USERNAME:}
    token: ${FF_ATLASSIAN_TOKEN:}
  gerrit:
    # Optional. Needed for private Gerrit servers and for posting review comments (Gerrit "HTTP password").
    username: ${GERRIT_USERNAME:}
    password: ${GERRIT_PASSWORD:}
  sandbox:
    # Where tests run (D-017, D-025, D-026):
    #   docker = isolated Linux container: tests run with no network, CPU/memory/process limits, time limit.
    #   local  = directly on this machine, no isolation. DEV ONLY, only for sample repos you trust.
    mode: ${FF_SANDBOX_MODE:docker}
    # Time limit for each sandbox step (prepare, test).
    timeout-minutes: 10
    # local mode only: used when a Maven repo has no mvnw of its own (FailureForge's own Maven wrapper).
    fallback-maven-wrapper: ${FF_FALLBACK_MVNW:./mvnw}
    docker:
      # Linux: "docker". Windows dev PC with WSL2: "wsl -d Ubuntu -e docker" (set in application-local.yml).
      command: ${FF_DOCKER_COMMAND:docker}
      image: maven:3.9-eclipse-temurin-21
      cpus: "2"
      memory: 4g
      pids-limit: 2048
